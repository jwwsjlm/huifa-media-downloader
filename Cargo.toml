[workspace]
members = ["crates/core", "crates/server", "crates/mcp", "src-tauri"]
default-members = ["crates/core", "crates/server"]
resolver = "3"

[workspace.package]
version = "0.5.2"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart", "socks"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
rusqlite = { version = "0.37", features = ["bundled"] }
hex = "0.4"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
libc = "0.2"
tokio-util = { version = "0.7", features = ["rt"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Globalization", "Win32_Storage_FileSystem"] }
chacha20poly1305 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
base64 = "0.22"
zip = { version = "4.6", default-features = false, features = ["deflate"] }
tar = "0.4"
xz2 = "0.1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
