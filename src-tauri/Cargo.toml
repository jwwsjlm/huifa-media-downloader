[package]
name = "huifa-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Huifa Media Downloader Rust desktop host"

[lib]
name = "huifa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
login-smoke = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
huifa-core = { path = "../crates/core" }
huifa-mcp = { path = "../crates/mcp" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
# Version 2.5 requires Rust 1.90; keep compatibility with the workspace's Rust 1.88.
tauri-plugin-clipboard-manager = "=2.3.3"
base64 = "0.22"
uuid.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"
soup3 = "0.5"
