name: Website query diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Acquire the failing CI runtime version
        shell: bash
        run: |
          git fetch --depth=1 origin 441f27fca89ad9228f144b544aed536b5f069d82
          git show 441f27fca89ad9228f144b544aed536b5f069d82:runtime-tool-lock.json > runtime-tool-lock.json
          node scripts/acquire-rust-tools.mjs windows-x86_64
      - name: Isolate website query
        run: cargo test --locked -p huifa-core sites::tests -- --include-ignored --test-threads=1 --nocapture
