name: Recover verified v0.2.0 publication

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: rust-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: 0.2.0
      RELEASE_SHA: 14755a49678d95893ff995e73f955da29b2b54d9
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate original build and publication fixes
        run: |
          node --test tests/*.test.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {spawnSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          const read = args => {
            const result = spawnSync('gh', ['api', ...args], {encoding:'utf8', shell:false});
            assert.equal(result.status, 0, result.stderr);
            return JSON.parse(result.stdout);
          };
          const base = `repos/${process.env.GITHUB_REPOSITORY}`;
          const run = read([`${base}/actions/runs/38513814321`]);
          assert.equal(run.head_sha, process.env.RELEASE_SHA);
          assert.equal(run.path, '.github/workflows/release.yml');
          assert.equal(run.status, 'completed');
          const jobs = read([`${base}/actions/runs/38513814321/jobs?per_page=100`]).jobs;
          for (const name of ['prepare', 'frontend', 'desktop (windows-latest, windows-x86_64)', 'desktop (ubuntu-22.04, linux-x86_64)', 'containers (amd64, ubuntu-24.04)', 'containers (arm64, ubuntu-24.04-arm)']) {
            assert.equal(jobs.find(job => job.name === name)?.conclusion, 'success', name);
          }
          const tag = read([`${base}/git/ref/tags/v${process.env.RELEASE_VERSION}`]);
          assert.equal(tag.object.type, 'commit');
          assert.equal(tag.object.sha, process.env.RELEASE_SHA);
          const notes = spawnSync('git', ['show', `${process.env.RELEASE_SHA}:release-notes/${process.env.RELEASE_VERSION}.md`], {encoding:'utf8', shell:false});
          assert.equal(notes.status, 0);
          assert.equal(notes.stdout, readFileSync(`release-notes/${process.env.RELEASE_VERSION}.md`, 'utf8'));
          JS
      - uses: actions/download-artifact@v4
        with:
          run-id: 38513814321
          github-token: ${{ github.token }}
          pattern: desktop-*
          merge-multiple: true
          path: rust-release-assets
      - uses: actions/download-artifact@v4
        with:
          run-id: 38513814321
          github-token: ${{ github.token }}
          pattern: image-*
          merge-multiple: true
          path: image-digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify signed artifacts and existing immutable image
        run: |
          node scripts/rust-update-manifest.mjs
          docker buildx imagetools inspect "$IMAGE:$RELEASE_VERSION" --raw > .tmp-version-manifest.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const manifest = JSON.parse(readFileSync('.tmp-version-manifest.json'));
          for (const arch of ['amd64', 'arm64']) {
            const digest = readFileSync(`image-digests/${arch}.txt`, 'utf8').trim().split('@')[1];
            assert(digest && manifest.manifests.some(item => item.digest === digest), `Image changed for ${arch}`);
          }
          JS
      - name: Publish verified release and desktop updates
        run: node scripts/publish-rust-release.mjs
      - name: Advance latest after publication succeeds
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$RELEASE_VERSION"
