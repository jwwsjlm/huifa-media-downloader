name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-velopack.txt

      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $Version = (python -c "from app.core.version import APP_VERSION; print(APP_VERSION)").Trim()
          if ($env:GITHUB_REF_NAME -ne "v$Version") {
              throw "Tag $env:GITHUB_REF_NAME does not match APP_VERSION $Version"
          }
          $ReleaseNotes = "release-notes\$Version.md"
          if (-not (Test-Path -LiteralPath $ReleaseNotes -PathType Leaf)) {
              throw "Release notes are required: $ReleaseNotes"
          }
          if ([string]::IsNullOrWhiteSpace((Get-Content -LiteralPath $ReleaseNotes -Raw -Encoding UTF8))) {
              throw "Release notes are empty: $ReleaseNotes"
          }
          "RELEASE_VERSION=$Version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_NOTES=$ReleaseNotes" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create release environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-build.txt -r requirements-velopack.txt

      - name: Download official release runtimes
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .\scripts\prepare_release_runtime.ps1

      - name: Build legacy portable update bridge
        shell: pwsh
        run: .\scripts\build_release.ps1

      - name: Build and verify installer
        shell: pwsh
        run: >-
          .\scripts\build_velopack_release.ps1
          -Version $env:RELEASE_VERSION
          -ReleaseNotes $env:RELEASE_NOTES
          -SkipTests

      - name: Package portable and installer ZIP files
        shell: pwsh
        run: >-
          .\scripts\package_github_release.ps1
          -Version $env:RELEASE_VERSION
          -ReleaseNotes $env:RELEASE_NOTES

      - name: Create GitHub Release page
        shell: pwsh
        run: >-
          .\.venv\Scripts\python.exe scripts\create_github_release_body.py
          --repository $env:GITHUB_REPOSITORY
          --tag $env:GITHUB_REF_NAME
          --version $env:RELEASE_VERSION
          --notes $env:RELEASE_NOTES
          --output release-assets\GITHUB_RELEASE.md

      - name: Preserve build artifact
        uses: actions/upload-artifact@v7
        with:
          name: HuifaMediaDownloader-${{ github.ref_name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Tag = $env:GITHUB_REF_NAME
          $Version = $Tag.TrimStart('v')
          $ReleaseBody = 'release-assets\GITHUB_RELEASE.md'
          $Assets = @(
              Get-ChildItem -LiteralPath 'release-assets' -File |
                  Where-Object { $_.Name -ne 'GITHUB_RELEASE.md' } |
                  ForEach-Object { $_.FullName }
          )
          if ($Assets.Count -lt 6) {
              throw "Release asset set is incomplete; found $($Assets.Count) files"
          }
          gh release view $Tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $Tag @Assets `
                  --repo $env:GITHUB_REPOSITORY `
                  --clobber
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              gh release edit $Tag `
                  --repo $env:GITHUB_REPOSITORY `
                  --latest `
                  --notes-file $ReleaseBody `
                  --title "Huifa Media Downloader $Version"
          }
          else {
              gh release create $Tag @Assets `
                  --repo $env:GITHUB_REPOSITORY `
                  --verify-tag `
                  --notes-file $ReleaseBody `
                  --latest `
                  --title "Huifa Media Downloader $Version"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
