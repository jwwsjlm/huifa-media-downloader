name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version, for example 2.1.3'
        required: true
        type: string
      release_notes:
        description: 'Markdown describing changes in this version'
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: rust-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate request and signing configuration
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" || { echo 'Release the reviewed default branch'; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Missing Tauri updater signing secret'; exit 1; }
          node --test tests/*.test.mjs
          node --input-type=module -e 'import {validateVersion,validateNotes} from "./scripts/rust-release.mjs"; validateVersion(process.env.RELEASE_VERSION); validateNotes(process.env.RELEASE_NOTES);'
          if git show-ref --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            echo 'Version already reserved; use rerun failed jobs to resume an interrupted publication'
            exit 1
          fi
          node --input-type=module -e 'import fs from "node:fs"; const key=JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json")).plugins?.updater?.pubkey; if (!key || !/^[A-Za-z0-9+/=]+$/.test(key)) throw Error("Missing committed updater public key");'
      - name: Synchronize version and create one build commit
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/rust-release.mjs
          node scripts/acquire-rust-tools.mjs --lock
          cargo update --workspace
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.toml Cargo.lock frontend/package.json frontend/package-lock.json src-tauri/tauri.conf.json runtime-tool-lock.json "release-notes/$RELEASE_VERSION.md"
          if ! git diff --cached --quiet; then git commit -m "release: v$RELEASE_VERSION"; fi
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  frontend:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run check --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - uses: actions/upload-artifact@v4
        with:
          name: shared-frontend
          path: frontend/dist
          if-no-files-found: error

  desktop:
    needs: [prepare, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-22.04
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev build-essential xvfb unzip
      - run: npm ci --prefix frontend
      - uses: actions/download-artifact@v4
        with:
          name: shared-frontend
          path: frontend/dist
      - name: Acquire pinned verified runtime tools
        run: node scripts/acquire-rust-tools.mjs ${{ matrix.platform }}
      - name: Test shared core and native file boundaries
        run: cargo test --locked --release -p huifa-core -p huifa-server -p huifa-desktop -- --include-ignored --test-threads=1
      - name: Build signed desktop from shared frontend
        shell: bash
        run: |
          node --input-type=module -e 'import fs from "node:fs";fs.mkdirSync(".tmp",{recursive:true});fs.writeFileSync(".tmp/tauri-ci.json",JSON.stringify({build:{beforeBuildCommand:""}}));'
          node frontend/node_modules/@tauri-apps/cli/tauri.js build --config .tmp/tauri-ci.json
      - name: Stage signed artifacts
        run: node scripts/stage-rust-artifacts.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: rust-release-assets
          if-no-files-found: error

  containers:
    needs: [prepare, frontend]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: shared-frontend
          path: frontend/dist
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: huifa-candidate:${{ matrix.arch }}
          build-args: USE_PREBUILT_FRONTEND=1
          cache-from: type=gha,scope=huifa-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=huifa-${{ matrix.arch }}
      - name: Exercise authentication and persistent data
        env:
          HUIFA_IMAGE: huifa-candidate:${{ matrix.arch }}
          HUIFA_PLATFORM: linux/${{ matrix.arch }}
        run: |
          node scripts/check-rust-container.mjs
          node docker/check-browser.mjs
      - name: Push immutable build candidate
        env:
          BUILD_SHA: ${{ needs.prepare.outputs.sha }}
          IMAGE: ghcr.io/${{ github.repository }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag "huifa-candidate:$ARCH" "$IMAGE:build-$BUILD_SHA-$ARCH"
          docker push "$IMAGE:build-$BUILD_SHA-$ARCH"
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:build-$BUILD_SHA-$ARCH")
          mkdir -p image-digests
          echo "$DIGEST" > "image-digests/$ARCH.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: image-digests
          if-no-files-found: error

  publish:
    needs: [prepare, frontend, desktop, containers]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: rust-release-assets
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: image-digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Validate complete signed desktop set
        run: node scripts/rust-update-manifest.mjs
      - name: Publish immutable multi-architecture image version
        run: |
          AMD64=$(cat image-digests/amd64.txt)
          ARM64=$(cat image-digests/arm64.txt)
          if docker buildx imagetools inspect "$IMAGE:$RELEASE_VERSION" > /dev/null 2>&1; then
            docker buildx imagetools inspect "$IMAGE:$RELEASE_VERSION" --raw > .tmp-version-manifest.json
            node --input-type=module -e 'import fs from "node:fs";let m=JSON.parse(fs.readFileSync(".tmp-version-manifest.json"));let d=[fs.readFileSync("image-digests/amd64.txt","utf8"),fs.readFileSync("image-digests/arm64.txt","utf8")].map(x=>x.trim().split("@")[1]);if(d.some(x=>!m.manifests.some(y=>y.digest===x)))throw Error("Published image differs; refusing overwrite");'
          else
            docker buildx imagetools create --tag "$IMAGE:$RELEASE_VERSION" "$AMD64" "$ARM64"
          fi
      - name: Publish verified release and desktop updates
        run: node scripts/publish-rust-release.mjs
      - name: Advance latest after publication succeeds
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$RELEASE_VERSION"
