name: Rust and React checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run check --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: node --test tests/*.test.mjs
      - run: node scripts/acquire-rust-tools.mjs --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: checked-frontend
          path: frontend/dist
          if-no-files-found: error
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: node scripts/acquire-rust-tools.mjs
      - run: cargo fmt --all --check
      - run: cargo test --locked --release -p huifa-core -p huifa-mcp -p huifa-server -- --include-ignored --test-threads=1
      - run: cargo clippy --locked -p huifa-core -p huifa-mcp -p huifa-server --all-targets -- -D warnings
  windows-login:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix frontend
      - run: node scripts/acquire-rust-tools.mjs windows-x86_64
      - name: Verify native login, cookie sync, IPC isolation and proxy
        run: node scripts/check-login-browser.mjs
      - name: Build desktop with the packaged frontend
        run: cargo build --locked --release -p huifa-desktop --features tauri/custom-protocol
      - name: Verify normal startup and visible initialization failures
        run: ./scripts/check-windows-startup.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-startup-${{ matrix.os }}
          path: |
            output/windows-startup/**/result.txt
            output/windows-startup/**/stderr.txt
            output/windows-startup/**/startup-error.log
            output/windows-startup/**/cleanup.txt
          if-no-files-found: ignore
  containers:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: checked-frontend
          path: frontend/dist
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: huifa-check:${{ matrix.arch }}
          build-args: USE_PREBUILT_FRONTEND=1
          cache-from: type=gha,scope=huifa-check-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=huifa-check-${{ matrix.arch }}
      - env:
          HUIFA_IMAGE: huifa-check:${{ matrix.arch }}
          HUIFA_PLATFORM: linux/${{ matrix.arch }}
        run: |
          node scripts/check-rust-container.mjs
          node docker/check-browser.mjs
